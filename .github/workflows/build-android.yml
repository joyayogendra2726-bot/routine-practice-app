name: Build Android AAB & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure SDK 36, Version & App Icon
        run: |
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/g' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/g' android/variables.gradle
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/versionCode 1/versionCode 3/g' android/app/build.gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          if [ -f "icon-512.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$dir
              cp icon-512.png android/app/src/main/res/$dir/ic_launcher.png
              cp icon-512.png android/app/src/main/res/$dir/ic_launcher_round.png
            done
          fi

      - name: Build Signed Release AAB & APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/routinepractice-release.keystore \
            -Pandroid.injected.signing.store.password=RoutinePractice2026 \
            -Pandroid.injected.signing.key.alias=routinepractice \
            -Pandroid.injected.signing.key.password=RoutinePractice2026

      - name: Export Upload Certificate PEM
        run: |
          keytool -export -rfc \
            -keystore ${{ github.workspace }}/routinepractice-release.keystore \
            -alias routinepractice \
            -storepass RoutinePractice2026 \
            -file upload_certificate.pem

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: routine-practice-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            upload_certificate.pem
