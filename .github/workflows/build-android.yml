name: Build Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Add Android
        run: |
          npm install
          npx cap add android
          npx cap sync android
          sed -i 's/34/35/g' android/variables.gradle
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties

      - name: Set App Icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp icon-512.png "$dir/ic_launcher.png" || true
              cp icon-512.png "$dir/ic_launcher_round.png" || true
            fi
          done

      - name: Build Debug APK & Signed Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=${{ github.workspace }}/routinepractice-release.keystore -Pandroid.injected.signing.store.password=RoutinePractice2026 -Pandroid.injected.signing.key.alias=routinepractice -Pandroid.injected.signing.key.password=RoutinePractice2026

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: RoutinePractice-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: RoutinePractice-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
