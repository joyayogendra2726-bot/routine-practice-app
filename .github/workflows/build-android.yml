name: Build Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Add Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Set App Icon
        run: |
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp icon-512.png "$dir/ic_launcher.png" || true
              cp icon-512.png "$dir/ic_launcher_round.png" || true
            fi
          done

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/tilestreak-release.keystore -alias tilestreak -keyalg RSA -keysize 2048 -validity 10000 -storepass TileStreak2026 -keypass TileStreak2026 -dname "CN=TileStreak, OU=App, O=TileStreak, L=Ahmedabad, S=Gujarat, C=IN"

      - name: Build Debug APK & Signed Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=tilestreak-release.keystore -Pandroid.injected.signing.store.password=TileStreak2026 -Pandroid.injected.signing.key.alias=tilestreak -Pandroid.injected.signing.key.password=TileStreak2026

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: TileStreak-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: TileStreak-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signing Keystore (Save Safely!)
        uses: actions/upload-artifact@v4
        with:
          name: TileStreak-Keystore
          path: android/app/tilestreak-release.keystore
